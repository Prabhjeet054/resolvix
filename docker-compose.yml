services:
  oracle:
    # Primary image: Oracle Database 23ai Free from Oracle Container Registry.
    image: container-registry.oracle.com/database/free:latest
    # Fallback if OCR login/EULA is a blocker: gvenzl/oracle-free:latest (Docker Hub).
    # Swap the image line above and keep the same ports, env_file, and volume.
    container_name: ticket-oracle-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      # First boot writes "DATABASE IS READY TO USE!" to the instance alert log.
      test:
        [
          "CMD-SHELL",
          "grep -q 'DATABASE IS READY TO USE!' /opt/oracle/diag/rdbms/free/FREE/trace/alert_FREE.log || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

volumes:
  oracle_data:
